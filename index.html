<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#201e1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Paintwheel — Wet Watercolor</title>
<style>
  :root {
    --panel-bg: rgba(32, 30, 27, 0.88);
    --panel-fg: #f0ece6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1816;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    touch-action: none;
    cursor: none;
  }
  /* brush cursor ring showing current load */
  #brushcursor {
    position: absolute;
    pointer-events: none;
    border: 1.5px solid rgba(40,40,40,0.55);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 5;
  }
  #toolbar {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--panel-bg);
    color: var(--panel-fg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 10;
  }
  #workbench {
    display: flex;
    gap: 10px;
    align-items: stretch;
    justify-content: center;
  }
  /* rotating mixing plate: 8 segments, one visible; ◀ ▶ turn the plate */
  #traywrap {
    position: relative;
    flex: 0 0 auto;
    width: 190px;
    height: 84px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.08);
    background: #f4f4f2;
  }
  #tray {
    width: 1520px; /* 8 segments x 190 */
    height: 84px;
    touch-action: none;
    transition: transform 0.25s ease;
  }
  .trayctl {
    position: absolute;
    width: 22px; height: 22px;
    border: none; border-radius: 50%;
    background: rgba(60,60,60,0.55);
    color: #fff;
    font-size: 12px; line-height: 22px;
    cursor: pointer;
    z-index: 2;
    padding: 0;
  }
  #rinse { top: 3px; right: 3px; }
  #segprev { bottom: 3px; left: 3px; }
  #segnext { bottom: 3px; right: 3px; }
  #seglabel {
    position: absolute;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(60,60,60,0.7);
    z-index: 2;
    pointer-events: none;
  }
  #tools {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
  }
  .tool {
    width: 44px; height: 38px;
    font-size: 20px;
    background: rgba(255,255,255,0.10);
    border: none; border-radius: 9px;
    cursor: pointer;
  }
  .tool:active { background: rgba(255,255,255,0.3); }
  /* brush tip indicator: color blob + water/paint level meters */
  #brushwrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #brushview {
    width: 34px; height: 34px;
    border-radius: 50% 50% 46% 46%;
    border: 2px solid rgba(255,255,255,0.35);
    background: #eee;
    box-shadow: inset 0 -5px 8px rgba(0,0,0,0.25);
  }
  .meter {
    width: 40px; height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .meter > div { height: 100%; border-radius: 3px; }
  #waterbar > div { background: #6db7e8; width: 60%; }
  #paintbar > div { background: #c66; width: 0%; }
  #consistency { font-size: 9px; opacity: 0.7; text-align: center; }
  #controls {
    display: flex;
    flex-direction: column;
    gap: 5px;
    justify-content: center;
    font-size: 11px;
    min-width: 120px;
  }
  .ctl { display: flex; align-items: center; gap: 5px; }
  input[type=range] { width: 70px; }
  select {
    background: rgba(255,255,255,0.12);
    color: var(--panel-fg);
    border: none; border-radius: 6px;
    padding: 3px 5px;
    font-size: 11px;
  }
  .btnrow { display: flex; gap: 4px; flex-wrap: wrap; }
  button.small {
    background: rgba(255,255,255,0.12);
    color: var(--panel-fg);
    border: none; border-radius: 7px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  button.small:active { background: rgba(255,255,255,0.28); }
  #palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    max-width: 460px;
    margin: 0 auto;
    width: 100%;
  }
  .panwrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
  }
  .pan {
    aspect-ratio: 1.35;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.45), inset 0 -1px 2px rgba(255,255,255,0.15);
    cursor: pointer;
    width: 100%;
  }
  .pan:active { transform: scale(0.93); }
  .panlabel {
    font-size: 8px;
    text-align: center;
    opacity: 0.75;
    white-space: nowrap;
    overflow: hidden;
  }
  /* paint box overlay: pick which paints occupy the 8 working pans */
  #boxpanel {
    position: absolute;
    inset: 0;
    background: rgba(20, 18, 16, 0.94);
    z-index: 30;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    overflow-y: auto;
    color: var(--panel-fg);
  }
  #boxpanel.open { display: flex; }
  #boxslots {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    max-width: 460px;
    margin: 0 auto;
    width: 100%;
  }
  #boxslots .pan.selected { outline: 2px solid #fff; }
  #boxgrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 7px;
    max-width: 620px;
    margin: 0 auto;
    width: 100%;
  }
  #boxgrid .pan.inuse { outline: 2px dashed rgba(255,255,255,0.5); }
  .boxhint { text-align: center; font-size: 12px; opacity: 0.75; }
  #boxclose {
    align-self: center;
    padding: 8px 22px;
    border: none; border-radius: 9px;
    background: rgba(255,255,255,0.16);
    color: var(--panel-fg);
    font-size: 14px;
    cursor: pointer;
  }
  #pigname {
    font-size: 11px;
    opacity: 0.75;
    text-align: center;
    min-height: 13px;
  }
  #err {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    color: #f0ece6; background: #201d1b;
    padding: 24px; text-align: center;
    font-size: 15px; line-height: 1.5;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="brushcursor"></div>
<div id="err"></div>
<div id="toolbar">
  <div id="workbench">
    <div id="traywrap">
      <canvas id="tray" title="Mixing plate: dab paints here and smear them with the brush"></canvas>
      <button id="rinse" class="trayctl" title="Rinse this segment">✕</button>
      <button id="segprev" class="trayctl" title="Turn plate left">◀</button>
      <button id="segnext" class="trayctl" title="Turn plate right">▶</button>
      <span id="seglabel">1/8</span>
    </div>
    <div id="tools">
      <button id="glass" class="tool" title="Water: tap = tip dip (adds water, keeps paint). ">💧</button>
      <button id="clean" class="tool" title="Rinse the brush clean in the jar">🌀</button>
      <button id="sponge" class="tool" title="Sponge: blot excess water off the brush (keeps most paint)">🧽</button>
      <div id="brushwrap" title="Brush: colour, water level (blue), paint level — their ratio is the consistency">
        <div id="brushview"></div>
        <div class="meter" id="waterbar"><div></div></div>
        <div class="meter" id="paintbar"><div></div></div>
        <div id="consistency">tea</div>
      </div>
    </div>
    <div id="controls">
      <div class="ctl"><span>Size</span><input id="size" type="range" min="2" max="60" value="16"></div>
      <div class="ctl"><span>Drying</span><input id="drying" type="range" min="0" max="100" value="30" title="How fast the paper dries"></div>
      <div class="ctl"><span>Paper</span><select id="paper"></select></div>
      <div class="btnrow"><button id="boxbtn" class="small">Paint box…</button></div>
      <div class="btnrow">
        <button id="salt" class="small" title="Salt: sprinkle into a damp wash for starbursts">🧂</button>
        <button id="wetview" class="small" title="Wetness view: see wet / satin / damp zones">👁</button>
        <button id="dry" class="small">Dry</button>
        <button id="clear" class="small">Clear</button>
        <button id="demo" class="small">Demo</button>
        <button id="tilt" class="small">Tilt</button>
        <button id="save" class="small">Save</button>
        <button id="log" class="small" title="Export this session's strokes as JSON">Log</button>
        <button id="reset" class="small" title="Clear painting, tray, palette and saved state">Reset</button>
      </div>
    </div>
  </div>
  <div id="palette"></div>
  <div id="pigname"></div>
</div>
<div id="boxpanel">
  <div class="boxhint">Your working palette — tap a pan to select the slot to refill:</div>
  <div id="boxslots"></div>
  <div class="boxhint">Paint box — tap a color to put it in the selected pan:</div>
  <div id="boxgrid"></div>
  <button id="boxclose">Done</button>
</div>
<script src="js/pigments.js"></script>
<script src="js/store.js"></script>
<script src="js/logbook.js"></script>
<script src="js/shaders.js"></script>
<script src="js/sim.js"></script>
<script src="js/demo.js"></script>
<script src="js/main.js"></script>
</body>
</html>
