<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Paintwheel — Wet Watercolor</title>
<style>
  :root {
    --panel-bg: rgba(32, 30, 27, 0.88);
    --panel-fg: #f0ece6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1816;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    touch-action: none;
    cursor: none;
  }
  /* brush cursor ring showing current load */
  #brushcursor {
    position: absolute;
    pointer-events: none;
    border: 1.5px solid rgba(40,40,40,0.55);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 5;
  }
  #toolbar {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--panel-bg);
    color: var(--panel-fg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 10;
  }
  #workbench {
    display: flex;
    gap: 10px;
    align-items: stretch;
    justify-content: center;
  }
  #traywrap { position: relative; flex: 0 0 auto; }
  #rinse {
    position: absolute;
    top: 3px; right: 3px;
    width: 22px; height: 22px;
    border: none; border-radius: 50%;
    background: rgba(60,60,60,0.55);
    color: #fff;
    font-size: 12px; line-height: 22px;
    cursor: pointer;
    z-index: 2;
  }
  #tray {
    width: 190px;
    height: 84px;
    border-radius: 10px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.08);
    touch-action: none;
    background: #f4f4f2;
    flex: 0 0 auto;
  }
  #tools {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
  }
  .tool {
    width: 44px; height: 38px;
    font-size: 20px;
    background: rgba(255,255,255,0.10);
    border: none; border-radius: 9px;
    cursor: pointer;
  }
  .tool:active { background: rgba(255,255,255,0.3); }
  /* brush tip indicator: color blob + water/paint level meters */
  #brushwrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #brushview {
    width: 34px; height: 34px;
    border-radius: 50% 50% 46% 46%;
    border: 2px solid rgba(255,255,255,0.35);
    background: #eee;
    box-shadow: inset 0 -5px 8px rgba(0,0,0,0.25);
  }
  .meter {
    width: 40px; height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .meter > div { height: 100%; border-radius: 3px; }
  #waterbar > div { background: #6db7e8; width: 60%; }
  #paintbar > div { background: #c66; width: 0%; }
  #controls {
    display: flex;
    flex-direction: column;
    gap: 5px;
    justify-content: center;
    font-size: 11px;
    min-width: 120px;
  }
  .ctl { display: flex; align-items: center; gap: 5px; }
  input[type=range] { width: 70px; }
  select {
    background: rgba(255,255,255,0.12);
    color: var(--panel-fg);
    border: none; border-radius: 6px;
    padding: 3px 5px;
    font-size: 11px;
  }
  .btnrow { display: flex; gap: 4px; flex-wrap: wrap; }
  button.small {
    background: rgba(255,255,255,0.12);
    color: var(--panel-fg);
    border: none; border-radius: 7px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  button.small:active { background: rgba(255,255,255,0.28); }
  #palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }
  .pan {
    aspect-ratio: 1.35;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.45), inset 0 -1px 2px rgba(255,255,255,0.15);
    cursor: pointer;
  }
  .pan:active { transform: scale(0.93); }
  #pigname {
    font-size: 11px;
    opacity: 0.75;
    text-align: center;
    min-height: 13px;
  }
  #err {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    color: #f0ece6; background: #201d1b;
    padding: 24px; text-align: center;
    font-size: 15px; line-height: 1.5;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="brushcursor"></div>
<div id="err"></div>
<div id="toolbar">
  <div id="workbench">
    <div id="traywrap">
      <canvas id="tray" title="Mixing tray: dab paints here and smear them with the brush"></canvas>
      <button id="rinse" title="Rinse the tray">✕</button>
    </div>
    <div id="tools">
      <button id="glass" class="tool" title="Water glass: dip to load water / dilute">💧</button>
      <button id="sponge" class="tool" title="Sponge: wipe the brush clean">🧽</button>
      <div id="brushwrap" title="Brush load: color, water level, paint level">
        <div id="brushview"></div>
        <div class="meter" id="waterbar"><div></div></div>
        <div class="meter" id="paintbar"><div></div></div>
      </div>
    </div>
    <div id="controls">
      <div class="ctl"><span>Size</span><input id="size" type="range" min="2" max="60" value="16"></div>
      <div class="ctl"><span>Paper</span><select id="paper"></select></div>
      <div class="btnrow">
        <button id="dry" class="small">Dry</button>
        <button id="clear" class="small">Clear</button>
        <button id="demo" class="small">Demo</button>
        <button id="tilt" class="small">Tilt</button>
        <button id="save" class="small">Save</button>
      </div>
    </div>
  </div>
  <div id="palette"></div>
  <div id="pigname"></div>
</div>
<script src="js/pigments.js"></script>
<script src="js/shaders.js"></script>
<script src="js/sim.js"></script>
<script src="js/demo.js"></script>
<script src="js/main.js"></script>
</body>
</html>
